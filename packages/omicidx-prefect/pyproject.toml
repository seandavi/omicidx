[project]
name = "omicidx-prefect"
version = "0.1.0"
description = "OmicIDX EL + transform pipeline over DuckLake (systemd-scheduled, no orchestrator)"
authors = [
    {name = "Sean Davis", email = "seandavi@gmail.com"},
]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "omicidx-parsers",
    "pyarrow>=20.0.0",
    "httpx>=0.28",
    "orjson>=3.10",
    "duckdb>=1.5.3",
    "universal-pathlib>=0.2.2",
    "s3fs>=2023.0.0",
    "tenacity>=8.0",
    "pubmed-parser @ git+https://github.com/seandavi/pubmed_parser",
    "polars-lts-cpu>=1.32",
    "python-dotenv>=1.1",
    "anyio[trio]>=4.0",
    "python-dateutil>=2.9",
    "pydantic-settings>=2.0",
    "click>=8.0",
    # [transform]: the plain-SQL runner + sqlglot that build the marts (ADR-0008).
    "cdsci-lake[transform] @ git+https://github.com/seandavi/cdsci-lake@e0f7ca8bcabd459f3e5c99170cd9dac8bd7ced0a",
    # Shared release-bundle mechanics (cdsci-lake ADR-0027): build, upload, HF push.
    "cdsci-publish[upload,hf] @ git+https://github.com/seandavi/cdsci-lake@4bf11b1113d1d25cf1a3c36d42d20c9db9939375#subdirectory=packages/cdsci-publish",
    "huggingface-hub>=2.2.0",
]

[project.scripts]
omicidx-prefect = "omicidx.prefect.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omicidx"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
omicidx-parsers = { workspace = true }

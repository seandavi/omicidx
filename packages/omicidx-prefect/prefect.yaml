# Prefect deployment manifest for omicidx ETL.
#
# Apply with (against the shared monode prefect-server):
#   docker compose exec worker prefect deploy --all
#
# Pipeline shape (post-DuckLake-cutover):
#   raw-extract -> ducklake-load -> parquet-export -> postgres-load -> publish-bundle
#   (publish-bundle builds omicidx.duckdb into the frozen bundle; the standalone
#    omicidx-duckdb-build deployment remains for ad-hoc rebuilds only.)
#
# Schedules:
#   - daily-pipeline:       02:00 UTC (full extract -> lake -> postgres -> build)
#   - ducklake-maintenance: 04:00 UTC Sunday (cleanup + compact; no expiry — retention unbounded)
#
# Extracts are migrating off Prefect onto systemd --user timers (#149). The
# `pubmed-extract` deployment is gone (#157): pubmed_extract is no longer a
# @flow, so there is nothing to deploy. Its hourly cadence lives in
# `systemd/omicidx-pubmed-extract.timer`. Removing the block from this file does
# NOT unregister the live schedule — that has to be deleted through the API (see
# systemd/README.md).
# The `geo-extract` deployment is gone too (#154): GEO runs on
# `systemd/omicidx-geo-extract.timer` and its entrypoint symbol
# `geo_extract_flow` no longer exists. It was never scheduled here, so nothing
# to unregister — stacked *manual* runs of it were the wedge it got blamed for.
# Ad-hoc is `omicidx-prefect run geo`.

name: omicidx-prefect
prefect-version: 3.0.0

build: null

push: null

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/omicidx

deployments:
  - name: daily-pipeline
    description: |
      Full daily ETL: raw extracts (semaphore-gated) -> ducklake-load
      (MERGE raw into lake.omicidx.*) -> postgres reload (reads the lake)
      -> duckdb build + upload.
    entrypoint: src/omicidx/prefect/flows/main.py:daily_pipeline_flow
    work_pool:
      name: default
      work_queue_name: default
    schedules:
      - cron: "0 2 * * *"
        timezone: UTC
        active: true
    parameters:
      force: false

  - name: ducklake-load
    description: |
      MERGE every entity's raw data into the DuckLake catalog
      (lake.omicidx.*). Standalone entry point; also runs inside
      daily-pipeline. Idempotent (hash-gated).
    entrypoint: src/omicidx/prefect/flows/ducklake_load.py:ducklake_load_flow
    work_pool:
      name: default
      work_queue_name: default

  - name: ducklake-maintenance
    description: |
      Catalog maintenance: delete unreferenced data files and compact
      adjacent files. Weekly. Retention is unbounded by default — snapshots
      are never expired unless retention_days is passed explicitly.
    entrypoint: src/omicidx/prefect/flows/ducklake_load.py:ducklake_maintenance_flow
    work_pool:
      name: default
      work_queue_name: default
    schedules:
      - cron: "0 4 * * 0"
        timezone: UTC
        active: true

  - name: parquet-export
    description: |
      Reverse-ETL: COPY every core lake table out to the public Parquet
      bucket — immutable v{date}/*.parquet + rolling latest/*.parquet
      (ADR-0004) — and prune dated folders past the retention window.
      Source for publish-bundle + the co-published views.sql. Standalone;
      also runs inside daily-pipeline.
    entrypoint: src/omicidx/prefect/flows/parquet_export.py:parquet_export_flow
    work_pool:
      name: default
      work_queue_name: default

  - name: publish-bundle
    description: |
      Frozen publisher (spec Stage B2/B4): build the external daily bundle —
      read-only file-based DuckLake catalog (anonymous HTTPS ATTACH),
      omicidx.duckdb, views.sql, and the provenance manifest — into
      v{date}/ + latest/. Runs after parquet-export inside daily-pipeline;
      standalone for ad-hoc republish (defaults date to today, reuses the
      latest exported Parquet).
    entrypoint: src/omicidx/prefect/flows/publish_bundle.py:publish_bundle_flow
    work_pool:
      name: default
      work_queue_name: default

  - name: postgres-load
    description: Reload every API-serving table from its DuckLake source table.
    entrypoint: src/omicidx/prefect/flows/postgres.py:postgres_load_flow
    work_pool:
      name: default
      work_queue_name: default

  - name: omicidx-duckdb-build
    description: Build the published omicidx.duckdb file and upload to R2/S3.
    entrypoint: src/omicidx/prefect/flows/sql.py:omicidx_duckdb_flow
    work_pool:
      name: default
      work_queue_name: default

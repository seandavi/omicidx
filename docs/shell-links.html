<script>
// "Open in DuckDB Shell" under each SQL example (#227). shell.duckdb.org runs
// the queries in its URL hash, #queries=v0,<q1>,<q2>,..., each one with
// space<->hyphen and semicolon<->tilde swapped, then URI-encoded (the
// symmetric `extraswaps` of duckdb/duckdb-wasm#1529). Examples that don't
// ATTACH get the latest database attached first. Opt out with `.no-shell`.
window.omicidxShellUrl = function (sql) {
  const swap = (s) => s.replace(/[ \-;~]/g, (c) => ({ " ": "-", "-": " ", ";": "~", "~": ";" })[c]);
  // ponytail: strips `--` comments without parsing strings; no example has `--` inside a literal.
  const stmts = sql.replace(/--[^\n]*/g, "").split(/;\s*(?:\n|$)/)
    .map((s) => s.replace(/\s+/g, " ").trim()).filter(Boolean);
  if (!/\bATTACH\b/i.test(sql)) {
    stmts.unshift(
      "ATTACH 'https://omicidx.cancerdatasci.org/data/latest/omicidx.duckdb' AS omicidx (READ_ONLY)",
      "USE omicidx",
    );
  }
  return "https://shell.duckdb.org/#queries=v0," +
    stmts.map((s) => encodeURIComponent(swap(s + ";"))).join(",");
};
document.querySelectorAll("pre.sourceCode.sql").forEach((pre) => {
  if (pre.matches(".no-shell, .no-shell *")) return;
  const a = document.createElement("a");
  a.href = window.omicidxShellUrl(pre.textContent);
  a.target = "_blank";
  a.rel = "noopener";
  a.className = "shell-link";
  a.textContent = "Open in DuckDB Shell ↗";
  const p = document.createElement("p");
  p.className = "small text-end";
  p.append(a);
  pre.closest("div.sourceCode").after(p);
});
</script>

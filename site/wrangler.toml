# Cloudflare Worker: the whole public omicidx site (#198).
#   omicidx.cancerdatasci.org/        -> docs (Astro build, Workers static assets)
#   omicidx.cancerdatasci.org/data/*  -> `data-omicidx` R2 bucket
#   data.omicidx.cancerdatasci.org/*  -> same bucket at `/` (published bundle
#                                        catalogs hard-code this URL; never redirect)
# The bucket path is the anonymous, credential-free read surface for the frozen
# bundle (spec §2 endpoint 2): range requests + CORS for DuckLake `ATTACH`.
#
# Deploy (needs `wrangler login`); the build step rebuilds docs/dist first:
#   cd site && npm ci && npx wrangler deploy
#
# custom_domain auto-creates the DNS records on deploy (cancerdatasci.org is
# Cloudflare-managed). The worker keeps its original name so the data host
# binding carries over.

name = "data-omicidx"
main = "src/index.ts"
compatibility_date = "2025-03-14"

[build]
command = "npm --prefix ../docs ci && npm --prefix ../docs run build"

[assets]
directory = "../docs/dist"
binding = "ASSETS"
not_found_handling = "404-page"
# The worker routes first: on the data host every path is a bucket key, even
# ones that collide with a docs asset (e.g. `/`).
run_worker_first = true

[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "data-omicidx"
remote = true  # `wrangler dev` reads the real bucket

[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "data_omicidx_usage"

[[routes]]
pattern = "omicidx.cancerdatasci.org"
custom_domain = true

[[routes]]
pattern = "data.omicidx.cancerdatasci.org"
custom_domain = true
